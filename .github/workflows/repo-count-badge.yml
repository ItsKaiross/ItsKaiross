name: Update Repo Count Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total repo count (public + private)
        id: repo_count
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: |
          response=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user)
          public=$(echo "$response" | jq '.public_repos // 0')
          private=$(echo "$response" | jq '.total_private_repos // 0')
          echo "total=$((public + private))" >> "$GITHUB_OUTPUT"

      - name: Write badge JSON
        run: |
          mkdir -p .github/badges
          cat > .github/badges/repo-count.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Total Repos",
            "message": "${{ steps.repo_count.outputs.total }}",
            "color": "6C63FF",
            "labelColor": "1a1b27",
            "style": "for-the-badge"
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/repo-count.json
          git diff --quiet --cached || git commit -m "chore: update repo count badge"
          git push
