name: Update Repo Count Badge

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total repo count (public + private)
        id: repo_count
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_COUNT_TOKEN secret is not set"
            exit 1
          fi

          response=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user)

          if echo "$response" | jq -e 'has("message")' > /dev/null; then
            echo "::error::GitHub API error: $(echo "$response" | jq -r '.message')"
            exit 1
          fi

          public=$(echo "$response" | jq '.public_repos')
          private=$(echo "$response" | jq '.total_private_repos')

          if [ "$public" = "null" ] || [ "$private" = "null" ]; then
            echo "::error::public_repos or total_private_repos missing from response. This usually means REPO_COUNT_TOKEN is a fine-grained PAT — use a classic PAT with 'repo' scope instead."
            exit 1
          fi

          echo "total=$((public + private))" >> "$GITHUB_OUTPUT"

      - name: Render badge SVG
        run: |
          mkdir -p .github/badges
          sed "s/{{TOTAL}}/${{ steps.repo_count.outputs.total }}/g" .github/badges/repo-count-template.svg > .github/badges/repo-count.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/repo-count.svg
          git diff --quiet --cached || git commit -m "chore: update repo count badge"
          for i in 1 2 3 4 5; do
            git push && break
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
