name: Update Commit Count Badge

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate commit count badge
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
          GH_USER: ItsKaiross
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_COUNT_TOKEN secret is not set"
            exit 1
          fi
          python3 .github/scripts/generate_commit_count_badge.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/commit-count.svg
          git diff --quiet --cached || git commit -m "chore: update commit count badge"
          git push
