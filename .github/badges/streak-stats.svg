<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .col { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .c1 { animation-delay: .3s; } .c2 { animation-delay: .5s; } .c3 { animation-delay: .7s; }
    .div { animation: fade .8s ease .4s both; }
    .ring { stroke-dasharray: 239; stroke-dashoffset: 239; animation: draw 1.4s cubic-bezier(.65,0,.35,1) .6s forwards; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: fade .4s ease 1.8s both, flicker 1.6s ease-in-out 2.2s infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .8s cubic-bezier(.34,1.56,.64,1) both; }
    .c1 .pop { animation-delay: .5s; } .c2 .pop { animation-delay: .9s; } .c3 .pop { animation-delay: .9s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 25% { transform: scale(1.12, .92) rotate(-4deg); } 50% { transform: scale(.94, 1.1) rotate(3deg); } 75% { transform: scale(1.06, .96) rotate(-2deg); } }
  </style>
  <g class="card">
  <rect x="0.5" y="0.5" rx="10" width="494" height="194" fill="#1a1b27"/>

  <line class="div" x1="165" y1="35" x2="165" y2="160" stroke="#33344a" stroke-width="1"/>
  <line class="div" x1="330" y1="35" x2="330" y2="160" stroke="#33344a" stroke-width="1"/>

  <g class="col c1" font-family="'Segoe UI', Ubuntu, Sans-Serif" text-anchor="middle">
    <text class="pop" x="82.5" y="80" font-size="40" font-weight="700" fill="#ffffff">999</text>
    <text x="82.5" y="112" font-size="14" font-weight="600" fill="#6C63FF">Total Contributions</text>
    <text x="82.5" y="132" font-size="11" fill="#8b8fa3">Nov 18, 2023 - Present</text>
  </g>

  <g class="col c2" font-family="'Segoe UI', Ubuntu, Sans-Serif" text-anchor="middle">
    <circle cx="247.5" cy="60" r="38" fill="none" stroke="#33344a" stroke-width="4"/>
    <circle class="ring" cx="247.5" cy="60" r="38" fill="none" stroke="#6C63FF" stroke-width="4" stroke-linecap="round" transform="rotate(-90 247.5 60)"/>
    <text class="flame" x="247.5" y="38" font-size="20" text-anchor="middle">🔥</text>
    <text class="pop" x="247.5" y="72" font-size="34" font-weight="700" fill="#ffffff">60</text>
    <text x="247.5" y="112" font-size="14" font-weight="600" fill="#00C896">Current Streak</text>
    <text x="247.5" y="132" font-size="11" fill="#8b8fa3">Jul 29 - Sep 26</text>
  </g>

  <g class="col c3" font-family="'Segoe UI', Ubuntu, Sans-Serif" text-anchor="middle">
    <text class="pop" x="412.5" y="80" font-size="40" font-weight="700" fill="#ffffff">60</text>
    <text x="412.5" y="112" font-size="14" font-weight="600" fill="#6C63FF">Longest Streak</text>
    <text x="412.5" y="132" font-size="11" fill="#8b8fa3">Jul 29 - Sep 26</text>
  </g>
</g>
</svg>
